name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-arm64]
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-11-arm
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-arm64
            os: macos-latest

    runs-on: ${{ matrix.os }}
    name: build ${{ matrix.rid }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PicoHtmx references PicoWeb as a sibling project when the PicoNode
      # repo is checked out next to this one (same layout as local dev and
      # as the PicoAgent/PicoActor/PicoNode sibling-checkout convention).
      - name: Checkout PicoNode (sibling)
        uses: actions/checkout@v4
        with:
          repository: PicoHex/PicoNode
          path: ../PicoNode
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Linux AOT prerequisites
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Restore
        run: |
          mkdir -p artifacts/nupkg
          dotnet restore PicoUI.slnx

      - name: Build
        run: dotnet build PicoUI.slnx --no-restore -c Release

      - name: Test PicoMarkdown
        run: dotnet test --project tests/PicoMarkdown.Tests/PicoMarkdown.Tests.csproj -c Release --no-build

      - name: Test PicoMermaid
        run: dotnet test --project tests/PicoMermaid.Tests/PicoMermaid.Tests.csproj -c Release --no-build

      - name: Test PicoTui
        run: dotnet test --project tests/PicoTui.Tests/PicoTui.Tests.csproj -c Release --no-build

      - name: Test PicoHtmx
        run: dotnet test --project tests/PicoHtmx.Tests/PicoHtmx.Tests.csproj -c Release --no-build

      # AOT validation on the samples: full ILC publish + native link, plus
      # a run smoke for the pure-compute samples (linux-x64 only).
      - name: AOT publish validation (PicoMarkdown.Sample)
        run: dotnet publish samples/PicoMarkdown.Sample/PicoMarkdown.Sample.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true

      - name: AOT publish validation (PicoMermaid.Sample)
        run: dotnet publish samples/PicoMermaid.Sample/PicoMermaid.Sample.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true

      - name: AOT publish validation (PicoTui.Sample)
        run: dotnet publish samples/PicoTui.Sample/PicoTui.Sample.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true

      - name: AOT publish validation (PicoHtmx.Sample)
        run: dotnet publish samples/PicoHtmx.Sample/PicoHtmx.Sample.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true

      - name: Run AOT-published Markdown sample (linux-x64 smoke)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          PUBLISH_DIR=$(ls -d samples/PicoMarkdown.Sample/bin/Release/*/linux-x64/publish | head -n 1)
          "$PUBLISH_DIR/PicoMarkdown.Sample"

      - name: Run AOT-published Mermaid sample (linux-x64 smoke)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          PUBLISH_DIR=$(ls -d samples/PicoMermaid.Sample/bin/Release/*/linux-x64/publish | head -n 1)
          "$PUBLISH_DIR/PicoMermaid.Sample"