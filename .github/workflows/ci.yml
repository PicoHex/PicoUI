name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-arm64]
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-11-arm
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-arm64
            os: macos-latest

    runs-on: ${{ matrix.os }}
    name: build ${{ matrix.rid }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No PicoNode checkout: cross-repo dependencies (PicoNode.Http,
      # PicoNode.Web, PicoWeb) are consumed as published packages, always.
      # Nothing in the build detects a sibling repo, so the graph restored
      # here is the same graph a consumer restores.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Install Linux AOT prerequisites
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      # No locked mode: nothing is committed to lock AGAINST. The declarations in
      # Directory.Packages.props float on purpose, and the packages.lock.json a
      # restore writes is a local record of what this leg resolved -- gitignored,
      # never reviewed, never replayed. The record still has to survive the run, so
      # it leaves as the `resolved-versions` artifact uploaded below.
      #
      # This restore is the default (RID-less) graph, and that graph is fully
      # packaged: PicoNode.Http / PicoNode.Web / PicoWeb arrive from the feed, so
      # every node in it — cross-repo or not — comes off nuget.org.
      - name: Restore
        run: |
          mkdir -p artifacts/nupkg
          dotnet restore PicoUI.slnx

      # Build per project (not via the solution): it keeps the restore above and
      # the Release configuration in one explicit place, and no project can pull
      # an out-of-repository build in with a configuration of its own.
      #
      # tests/* is built here on purpose: every Test step below runs with
      # --no-build, which is a contract that the binary already exists. Leaving
      # the test projects out of this loop made the first Test step fail on a
      # clean runner and skipped the other three plus the whole AOT matrix.
      - name: Build
        shell: bash
        run: |
          for proj in src/*/*.csproj tests/*/*.Tests.csproj samples/*/*.csproj; do
            dotnet build "$proj" --no-restore -c Release || exit 1
          done

      - name: Test PicoMarkdown
        run: dotnet test --project tests/PicoMarkdown.Tests/PicoMarkdown.Tests.csproj -c Release --no-build

      - name: Test PicoMermaid
        run: dotnet test --project tests/PicoMermaid.Tests/PicoMermaid.Tests.csproj -c Release --no-build

      - name: Test PicoTui
        run: dotnet test --project tests/PicoTui.Tests/PicoTui.Tests.csproj -c Release --no-build

      - name: Test PicoHtmx
        run: dotnet test --project tests/PicoHtmx.Tests/PicoHtmx.Tests.csproj -c Release --no-build

      # (Removed, lane NOLOCK: "Lock graph guard (after build and tests)".) That step
      # ran `git status --porcelain -- '*packages.lock.json'` and failed the job when a
      # build or test step had rewritten a lock. The defect it guarded against (commit
      # b4d6423) was a COMMITTED rewrite; the file is gitignored now, so a build that
      # touches it leaves `git status` clean and changes only a local record, which is
      # what the file is for. Keeping the step would leave a green guard over an empty
      # list. The record still leaves the runner, as data:
      # The resolved versions, as data instead of as a committed file. Restore writes
      # `packages.lock.json` beside every project (RestorePackagesWithLockFile=true in
      # Directory.Build.props) and .gitignore keeps it out of the tree; uploading it here
      # is what makes "which exact versions did this build use" answerable after the
      # runner is gone -- the one job the tracked lock used to do.
      # `if: always()` on purpose: a leg that fails after restore still produced a
      # resolution, and that is exactly the run somebody needs to inspect.
      - name: Upload resolved versions (restore record)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolved-versions-${{ matrix.rid }}
          path: |
            **/packages.lock.json
          if-no-files-found: warn
          retention-days: 30

      # AOT validation on the samples: full ILC publish + native link, plus
      # run smokes on linux-x64 (Markdown/Mermaid run standalone; the Htmx
      # sample is served and probed because its attribute writer is the
      # trim-sensitive path).
      #
      # These publishes restore again, and that reshape is harmless now: `-r <rid>`
      # and `-p:PublishAot=true` rewrite the lock beside each project into a RID +
      # ILCompiler shape, which is simply what the local record looks like after this
      # step. Nothing compares against it and .gitignore keeps it out of the tree, so
      # the `-p:NuGetLockFilePath=obj/publish-graph.lock.json` redirection this file
      # used to carry — a workaround for a TRACKED lock — went with the tracked lock.
      #
      # -f net10.0 is not decoration either: the projects multi-target
      # net10.0;net11.0, and a publish that also takes `-r <rid>` must name ONE
      # framework (there is no single RID graph for two of them). net10.0 is the
      # TFM this repository ships and the one the smoke steps below run.
      - name: AOT publish validation (PicoMarkdown.Sample)
        run: dotnet publish samples/PicoMarkdown.Sample/PicoMarkdown.Sample.csproj -c Release -f net10.0 -r ${{ matrix.rid }} -p:PublishAot=true

      - name: AOT publish validation (PicoMermaid.Sample)
        run: dotnet publish samples/PicoMermaid.Sample/PicoMermaid.Sample.csproj -c Release -f net10.0 -r ${{ matrix.rid }} -p:PublishAot=true

      - name: AOT publish validation (PicoTui.Sample)
        run: dotnet publish samples/PicoTui.Sample/PicoTui.Sample.csproj -c Release -f net10.0 -r ${{ matrix.rid }} -p:PublishAot=true

      # PicoHtmx.Sample publishes against the same published PicoNode packages
      # every other step uses, so no sibling-source switch is needed. (A
      # build of this sample could not AOT-publish at all: -p:PublishAot=true is
      # a global property and would flow into PicoNode's netstandard2.0
      # source-generator projects, NETSDK1207.)
      - name: AOT publish validation (PicoHtmx.Sample)
        run: dotnet publish samples/PicoHtmx.Sample/PicoHtmx.Sample.csproj -c Release -f net10.0 -r ${{ matrix.rid }} -p:PublishAot=true

      # (Removed, lane NOLOCK: "Lock graph guard (after AOT publishes)".) Same reason as
      # the build/test guard above: the publish rewrites a local, gitignored record, so
      # there is nothing tracked for this step to catch.

      - name: Run AOT-published Markdown sample (linux-x64 smoke)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          PUBLISH_DIR=$(ls -d samples/PicoMarkdown.Sample/bin/Release/*/linux-x64/publish | head -n 1)
          "$PUBLISH_DIR/PicoMarkdown.Sample"

      - name: Run AOT-published Mermaid sample (linux-x64 smoke)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          PUBLISH_DIR=$(ls -d samples/PicoMermaid.Sample/bin/Release/*/linux-x64/publish | head -n 1)
          "$PUBLISH_DIR/PicoMermaid.Sample"

      # Executed smoke for the reflective attribute path under AOT/trimming:
      # the served page must still carry the anonymous-type attributes.
      - name: Run AOT-published Htmx sample (linux-x64 smoke)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          PUBLISH_DIR=$(ls -d samples/PicoHtmx.Sample/bin/Release/*/linux-x64/publish | head -n 1)
          "$PUBLISH_DIR/PicoHtmx.Sample" > /tmp/htmx-sample.log 2>&1 &
          for _ in $(seq 1 30); do grep -q '127.0.0.1:' /tmp/htmx-sample.log && break; sleep 1; done
          PORT=$(grep -oE '127.0.0.1:[0-9]+' /tmp/htmx-sample.log | head -1 | cut -d: -f2)
          test -n "$PORT"
          PAGE=$(curl -s "http://127.0.0.1:$PORT/")
          echo "$PAGE" | grep -q 'class="logo"'
          echo "$PAGE" | grep -q '<div id="hello"></div>'
          kill %1 || true

  # Dependency policy gate (R1-R7, R7b, R10 of picohex-dependency-policy).
  # The checker is vendored: scripts/check-dependency-policy.sh carries the same
  # bytes in every PicoHex repo and names the canonical source in its header.
  policy:
    name: dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the dependency policy
        run: bash scripts/check-dependency-policy.sh .
