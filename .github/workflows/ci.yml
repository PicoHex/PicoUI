name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-arm64]
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-11-arm
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-arm64
            os: macos-latest

    runs-on: ${{ matrix.os }}
    name: build ${{ matrix.rid }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No PicoNode checkout: cross-repo dependencies (PicoNode.Http,
      # PicoNode.Web, PicoWeb) are consumed as published packages, always.
      # Nothing in the build detects a sibling repo, so the graph restored
      # here is the same graph a consumer restores.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Install Linux AOT prerequisites
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      # Locked mode: the committed packages.lock.json files are authoritative, so
      # a re-resolved graph fails HERE instead of silently building versions
      # nobody reviewed. Moving the locks is deps-refresh.yml's job, not a
      # build's. This restore is the default (RID-less) graph the locks describe,
      # and that graph is fully packaged: PicoNode.Http / PicoNode.Web / PicoWeb
      # arrive from the feed, so every node in it — cross-repo or not — is
      # pinned by the committed locks.
      - name: Restore
        run: |
          mkdir -p artifacts/nupkg
          dotnet restore PicoUI.slnx -p:RestoreLockedMode=true

      # Build per project (not via the solution): it keeps the restore above and
      # the Release configuration in one explicit place, and no project can pull
      # an out-of-repository build in with a configuration of its own.
      #
      # tests/* is built here on purpose: every Test step below runs with
      # --no-build, which is a contract that the binary already exists. Leaving
      # the test projects out of this loop made the first Test step fail on a
      # clean runner and skipped the other three plus the whole AOT matrix.
      - name: Build
        shell: bash
        run: |
          for proj in src/*/*.csproj tests/*/*.Tests.csproj samples/*/*.csproj; do
            dotnet build "$proj" --no-restore -c Release || exit 1
          done

      - name: Test PicoMarkdown
        run: dotnet test --project tests/PicoMarkdown.Tests/PicoMarkdown.Tests.csproj -c Release --no-build

      - name: Test PicoMermaid
        run: dotnet test --project tests/PicoMermaid.Tests/PicoMermaid.Tests.csproj -c Release --no-build

      - name: Test PicoTui
        run: dotnet test --project tests/PicoTui.Tests/PicoTui.Tests.csproj -c Release --no-build

      - name: Test PicoHtmx
        run: dotnet test --project tests/PicoHtmx.Tests/PicoHtmx.Tests.csproj -c Release --no-build

      # The committed packages.lock.json files are a REVIEWED artifact: they are
      # the only thing that makes the y-floating versions in
      # Directory.Packages.props reproducible, and deps-refresh.yml — not a build
      # — is what moves them. So a build step that rewrites one is a defect, not
      # a refresh: commit b4d6423 shipped exactly that rewrite as if it were the
      # fix, and every later locked Restore then failed NU1004 on four of the five
      # RIDs. Nobody notices a lock move that arrives inside a green run, so the
      # run must not be green. This guard fails the job on any tracked lock a
      # build or test step rewrote, and on any lock file that appeared from
      # nowhere: `git status --porcelain` reports modified tracked files (what
      # `git diff --exit-code` reports) plus untracked ones.
      - name: Lock graph guard (after build and tests)
        shell: bash
        run: |
          changed=$(git status --porcelain -- '*packages.lock.json')
          if [ -n "$changed" ]; then
            echo "::error::a build or test step rewrote the package lock graph"
            echo "$changed"
            echo "The committed locks are the reviewed graph; only deps-refresh.yml may move them."
            echo "If this came from a local AOT publish: git checkout -- '*/packages.lock.json' and publish with -p:NuGetLockFilePath=obj/publish-graph.lock.json (docs/releasing.md)."
            exit 1
          fi

      # AOT validation on the samples: full ILC publish + native link, plus
      # run smokes on linux-x64 (Markdown/Mermaid run standalone; the Htmx
      # sample is served and probed because its attribute writer is the
      # trim-sensitive path).
      #
      # These publishes restore again, deliberately NOT locked: `-r <rid>` and
      # `-p:PublishAot=true` reshape the graph — one packages.lock.json can only
      # describe the RID-less default build. They run
      # after every locked restore in this job and never feed one, so nothing
      # unguarded reaches the compile graph.
      #
      # -p:NuGetLockFilePath=obj/publish-graph.lock.json is NOT decoration. An
      # implicit restore here writes back the lock it was given, so an unflagged
      # publish rewrote 8 of the 12 committed locks into a RID + ILCompiler shape
      # on every run — byte-identical to the b4d6423 regression, i.e. the old
      # accident recreated itself. `-p:RestorePackagesWithLockFile=false`, the
      # obvious switch, cannot be used: NuGet rejects it with NU1005 while a lock
      # file exists. Redirecting the lock path is the supported way to keep a
      # lock-shaped restore out of a committed file — the RID graph lands beside
      # the other build output in obj/ (git-ignored) and the committed locks stay
      # exactly as reviewed.
      #
      # -f net10.0 is not decoration either: the projects multi-target
      # net10.0;net11.0, and a publish that also takes `-r <rid>` must name ONE
      # framework (there is no single RID graph for two of them). net10.0 is the
      # TFM this repository ships and the one the smoke steps below run.
      - name: AOT publish validation (PicoMarkdown.Sample)
        run: dotnet publish samples/PicoMarkdown.Sample/PicoMarkdown.Sample.csproj -c Release -f net10.0 -r ${{ matrix.rid }} -p:PublishAot=true -p:NuGetLockFilePath=obj/publish-graph.lock.json

      - name: AOT publish validation (PicoMermaid.Sample)
        run: dotnet publish samples/PicoMermaid.Sample/PicoMermaid.Sample.csproj -c Release -f net10.0 -r ${{ matrix.rid }} -p:PublishAot=true -p:NuGetLockFilePath=obj/publish-graph.lock.json

      - name: AOT publish validation (PicoTui.Sample)
        run: dotnet publish samples/PicoTui.Sample/PicoTui.Sample.csproj -c Release -f net10.0 -r ${{ matrix.rid }} -p:PublishAot=true -p:NuGetLockFilePath=obj/publish-graph.lock.json

      # PicoHtmx.Sample publishes against the same published PicoNode packages
      # every other step uses, so no sibling-source switch is needed. (A
      # build of this sample could not AOT-publish at all: -p:PublishAot=true is
      # a global property and would flow into PicoNode's netstandard2.0
      # source-generator projects, NETSDK1207.)
      - name: AOT publish validation (PicoHtmx.Sample)
        run: dotnet publish samples/PicoHtmx.Sample/PicoHtmx.Sample.csproj -c Release -f net10.0 -r ${{ matrix.rid }} -p:PublishAot=true -p:NuGetLockFilePath=obj/publish-graph.lock.json

      # Same guard as the build/test one, placed after the only steps that reshape
      # the graph on purpose. Without it an AOT publish could rewrite the locks
      # and still leave a green run; with it, a future edit that drops the flag
      # fails here instead of in someone's next locked restore.
      - name: Lock graph guard (after AOT publishes)
        shell: bash
        run: |
          changed=$(git status --porcelain -- '*packages.lock.json')
          if [ -n "$changed" ]; then
            echo "::error::an AOT publish rewrote the package lock graph"
            echo "$changed"
            echo "The publish is missing -p:NuGetLockFilePath=obj/publish-graph.lock.json."
            exit 1
          fi

      - name: Run AOT-published Markdown sample (linux-x64 smoke)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          PUBLISH_DIR=$(ls -d samples/PicoMarkdown.Sample/bin/Release/*/linux-x64/publish | head -n 1)
          "$PUBLISH_DIR/PicoMarkdown.Sample"

      - name: Run AOT-published Mermaid sample (linux-x64 smoke)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          PUBLISH_DIR=$(ls -d samples/PicoMermaid.Sample/bin/Release/*/linux-x64/publish | head -n 1)
          "$PUBLISH_DIR/PicoMermaid.Sample"

      # Executed smoke for the reflective attribute path under AOT/trimming:
      # the served page must still carry the anonymous-type attributes.
      - name: Run AOT-published Htmx sample (linux-x64 smoke)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          PUBLISH_DIR=$(ls -d samples/PicoHtmx.Sample/bin/Release/*/linux-x64/publish | head -n 1)
          "$PUBLISH_DIR/PicoHtmx.Sample" > /tmp/htmx-sample.log 2>&1 &
          for _ in $(seq 1 30); do grep -q '127.0.0.1:' /tmp/htmx-sample.log && break; sleep 1; done
          PORT=$(grep -oE '127.0.0.1:[0-9]+' /tmp/htmx-sample.log | head -1 | cut -d: -f2)
          test -n "$PORT"
          PAGE=$(curl -s "http://127.0.0.1:$PORT/")
          echo "$PAGE" | grep -q 'class="logo"'
          echo "$PAGE" | grep -q '<div id="hello"></div>'
          kill %1 || true
