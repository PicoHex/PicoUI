name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-arm64]
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-arm64
            os: windows-11-arm
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: osx-arm64
            os: macos-latest

    runs-on: ${{ matrix.os }}
    name: build ${{ matrix.rid }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PicoHtmx references PicoWeb as a sibling project when the PicoNode
      # repo is checked out next to this one (same layout as local dev and
      # as the PicoAgent/PicoActor/PicoNode sibling-checkout convention).
      - name: Checkout PicoNode (sibling)
        uses: actions/checkout@v4
        with:
          repository: PicoHex/PicoNode
          path: ../PicoNode
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Linux AOT prerequisites
        if: startsWith(matrix.rid, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Restore
        run: |
          mkdir -p artifacts/nupkg
          dotnet restore PicoUI.slnx

      # Build per project (not via the solution): a solution build dispatches
      # the out-of-solution sibling PicoNode projects with their default Debug
      # configuration, so PicoUI Release outputs would link Debug PicoNode.
      # Per-project builds propagate -c Release to project references.
      - name: Build
        shell: bash
        run: |
          for proj in src/*/*.csproj samples/*/*.csproj; do
            dotnet build "$proj" --no-restore -c Release || exit 1
          done

      - name: Test PicoMarkdown
        run: dotnet test --project tests/PicoMarkdown.Tests/PicoMarkdown.Tests.csproj -c Release --no-build

      - name: Test PicoMermaid
        run: dotnet test --project tests/PicoMermaid.Tests/PicoMermaid.Tests.csproj -c Release --no-build

      - name: Test PicoTui
        run: dotnet test --project tests/PicoTui.Tests/PicoTui.Tests.csproj -c Release --no-build

      - name: Test PicoHtmx
        run: dotnet test --project tests/PicoHtmx.Tests/PicoHtmx.Tests.csproj -c Release --no-build

      # AOT validation on the samples: full ILC publish + native link, plus
      # run smokes on linux-x64 (Markdown/Mermaid run standalone; the Htmx
      # sample is served and probed because its attribute writer is the
      # trim-sensitive path).
      - name: AOT publish validation (PicoMarkdown.Sample)
        run: dotnet publish samples/PicoMarkdown.Sample/PicoMarkdown.Sample.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true

      - name: AOT publish validation (PicoMermaid.Sample)
        run: dotnet publish samples/PicoMermaid.Sample/PicoMermaid.Sample.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true

      - name: AOT publish validation (PicoTui.Sample)
        run: dotnet publish samples/PicoTui.Sample/PicoTui.Sample.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true

      # The sibling layout cannot AOT-publish this sample: -p:PublishAot=true is
      # a global property and flows into PicoNode's netstandard2.0 source-generator
      # projects (NETSDK1207). Publish against the published PicoNode packages;
      # sibling integration is covered by the build/test steps above.
      - name: AOT publish validation (PicoHtmx.Sample)
        run: dotnet publish samples/PicoHtmx.Sample/PicoHtmx.Sample.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true -p:UseSiblingProjectReferences=false

      - name: Run AOT-published Markdown sample (linux-x64 smoke)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          PUBLISH_DIR=$(ls -d samples/PicoMarkdown.Sample/bin/Release/*/linux-x64/publish | head -n 1)
          "$PUBLISH_DIR/PicoMarkdown.Sample"

      - name: Run AOT-published Mermaid sample (linux-x64 smoke)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          PUBLISH_DIR=$(ls -d samples/PicoMermaid.Sample/bin/Release/*/linux-x64/publish | head -n 1)
          "$PUBLISH_DIR/PicoMermaid.Sample"

      # Executed smoke for the reflective attribute path under AOT/trimming:
      # the served page must still carry the anonymous-type attributes.
      - name: Run AOT-published Htmx sample (linux-x64 smoke)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          PUBLISH_DIR=$(ls -d samples/PicoHtmx.Sample/bin/Release/*/linux-x64/publish | head -n 1)
          "$PUBLISH_DIR/PicoHtmx.Sample" > /tmp/htmx-sample.log 2>&1 &
          for _ in $(seq 1 30); do grep -q '127.0.0.1:' /tmp/htmx-sample.log && break; sleep 1; done
          PORT=$(grep -oE '127.0.0.1:[0-9]+' /tmp/htmx-sample.log | head -1 | cut -d: -f2)
          test -n "$PORT"
          PAGE=$(curl -s "http://127.0.0.1:$PORT/")
          echo "$PAGE" | grep -q 'class="logo"'
          echo "$PAGE" | grep -q '<div id="hello"></div>'
          kill %1 || true
