# Dependency refresh — re-evaluates the floating y-segments.
#
# Directory.Packages.props floats `2026.<x>.*` for the one-party packages that
# ship no analyzer (PicoNode.Http, PicoNode.Web); PicoWeb and PicoJetson stay
# pinned because their nupkgs inject source generators into every consumer. A
# float only moves when a restore re-resolves it, and ci.yml restores in LOCKED
# mode, so without this job the floats would freeze at whatever the committed
# packages.lock.json files say and the policy would be decoration. On demand:
# `dotnet restore --force-evaluate` re-resolves every float, and if the lock
# files moved this commits them to a bot-owned branch and opens (or updates) a
# PR. Deliberately does NOT build — the PR's own ci run is the gate, and a
# refresh that breaks the build must fail there, visibly, not be swept into a
# green commit by this job.

name: deps-refresh

on:
  workflow_dispatch:

concurrency:
  group: deps-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  refresh:
    runs-on: ubuntu-latest
    name: re-resolve floats
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # MUST mirror ci.yml, or the refresh would resolve a DIFFERENT graph than
      # the committed lock files describe. With PicoNode checked out next to this
      # repo, Directory.Build.props sets UseSiblingProjectReferences=true and the
      # build links sibling SOURCE; PicoNode.Http / PicoNode.Web are then not
      # packages at all, so those two floats do not even appear in most locks.
      # Without the sibling the package graph is resolved instead and every lock
      # file is rewritten into something ci.yml (locked mode) rejects.
      - name: Checkout PicoNode (sibling)
        uses: actions/checkout@v4
        with:
          repository: PicoHex/PicoNode
          path: ../PicoNode
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # NuGet.config maps a local folder feed (artifacts/nupkg); it must exist
      # before restore or NuGet fails with NU1301 — same as ci.yml.
      - name: Prepare local feed
        shell: bash
        run: mkdir -p artifacts/nupkg

      # --force-evaluate is the whole point: a plain restore honours the versions
      # already recorded in packages.lock.json and would report "up to date"
      # forever. Locked mode is deliberately NOT requested — this step exists to
      # rewrite the locks.
      - name: Re-resolve the floating y-segments
        run: dotnet restore PicoUI.slnx --force-evaluate

      - name: Detect what moved
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          # Only lock files count: the sibling PicoNode checkout lives outside
          # this repository, so a refresh that also rewrote ITS locks is invisible
          # here (and uncommittable) by construction.
          if [ -z "$(git status --porcelain -- '*packages.lock.json')" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::the floats still resolve to the committed versions — nothing to do"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git status --porcelain -- '*packages.lock.json'
          # One line per resolved-version change, so the log says WHAT moved
          # without unpacking twelve lock files by hand.
          git diff --unified=0 -- '*packages.lock.json' \
            | grep -E '^[+-].*"(resolved|requested)":' || true

      - name: Commit the refreshed locks and open a PR
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch=chore/deps-refresh
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$branch"
          # Exact add: lock files only. A refresh PR that also carried source or
          # csproj churn would hide the version move it is supposed to expose.
          git add -- '*packages.lock.json'
          if git diff --cached --quiet; then
            echo "::notice::lock files were touched but staged nothing — nothing to commit"
            exit 0
          fi
          git commit -m "build(deps): refresh packages.lock.json"

          # --force-with-lease: this branch belongs to the bot alone and is
          # rebuilt from the default branch on every run.
          git push --force-with-lease origin "$branch"

          existing=$(gh pr list --head "$branch" --state open --json number --jq '.[].number')
          if [ -n "$existing" ]; then
            echo "::notice::PR #$existing already open for $branch — the refresh was pushed into it"
            exit 0
          fi

          # Single-quoted strings so the markdown backticks stay literal and no
          # line picks up the YAML indentation.
          notes=$(printf '%s\n' \
            'Automated re-resolution of the floating `2026.<x>.*` one-party packages in `Directory.Packages.props`.' \
            '' \
            '`dotnet restore --force-evaluate` moved at least one pinned version; the diff is the lock files and nothing else. A move is safe by construction — a `<year>.<x>.<y>` float accepts a y bump only, and a y bump means the public API did not change — but the build is the judge: this PR runs the normal `ci` matrix, in locked mode, against exactly these files.' \
            '' \
            '`PicoWeb` and `PicoJetson` cannot appear here: they are pinned because their nupkgs inject source generators into every consumer.' \
            '' \
            'Close without merging to keep the current pins until the next pre-release refresh.')

          gh pr create --head "$branch" --base "$BASE_BRANCH" \
            --title "build(deps): refresh packages.lock.json" \
            --body "$notes"
